name: temp-pytest-charge
on:
  push:
    paths:
      - ".github/workflows/_tmp_pytest_charge.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e '.[test]'
          python -m pytest -q > /tmp/pytest.txt 2>&1 || true
          cat /tmp/pytest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-charge-output
          path: /tmp/pytest.txt
