name: audit-a124-vsa-functions
on:
  push:
    branches: [audit/a124-vsa-functions]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect canonical VSA functions
        run: |
          set -e
          rm -rf /tmp/ibsng && mkdir -p /tmp/ibsng
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/ibsng
          grep -n "_Pkt.*Vendor\|VendorAttribute\|vendor.*code\|vendor.*type" /tmp/ibsng/IBSng/radius_server/pyrad/packet.py
          sed -n '235,285p' /tmp/ibsng/IBSng/radius_server/pyrad/packet.py
