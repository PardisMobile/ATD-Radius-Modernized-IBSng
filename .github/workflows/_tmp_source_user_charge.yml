name: temp-source-user-charge
on:
  push:
    paths:
      - ".github/workflows/_tmp_source_user_charge.yml"
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/src
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/src
          grep -RniE "charge(_id|_obj)|getChargeID|InternetCharge|charge_main" /tmp/src/IBSng/core/user /tmp/src/IBSng/core/group 2>/dev/null | head -n 500 > /tmp/trace.txt
      - uses: actions/upload-artifact@v4
        with:
          name: user-charge-source
          path: /tmp/trace.txt
