name: temp-ras-source
on:
  push:
    paths: [".github/workflows/temp-ras-source.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect RAS source
        run: |
          set -euo pipefail
          mkdir -p /tmp/ibs
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/ibs
          find /tmp/ibs -type f | grep -E '/(ras|radius_server|core/ras|core/user/ras)' | head -200 > /tmp/files.txt || true
          echo "===FILES==="
          cat /tmp/files.txt
          echo "===RAS IMPORTS/CLASSES==="
          grep -RInE 'class .*RAS|ras_msg\[|multi_login|_handleRadAcctPacket|Acct-Status-Type|Start|Stop|Alive|Disconnect|CoA|Framed-IP-Address|Framed-IP-Netmask' /tmp/ibs --include='*.py' | grep -E '/(ras|radius_server)/' | head -1200 > /tmp/ras.txt || true
          cat /tmp/ras.txt
          echo "===PROVIDERS==="
          find /tmp/ibs -type f -name '*.py' | grep -E '/ras/|/radius_server/' | sort | head -400
