name: temp-ras-profiles
on:
  push:
    paths: [".github/workflows/temp-ras-profiles.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          mkdir -p /tmp/ibs
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/ibs
          for f in asterisk bsae chilli_spot cisco cisco_vpdn gnugk mikrotik mvts pppd tenor portmaster portslave plan ser total_control; do
            echo "===== $f.py ====="
            sed -n '1,230p' "/tmp/ibs/IBSng/core/ras/rases/$f.py" 2>/dev/null | grep -E 'class |ras_msg\[|status_type|Acct-Status-Type|unique_id|ip_assignment|multi_login|start_accounting|update_attrs|persistent_lan|voip_|h323_|remote_ip|session_id|port|called_number|call_id'
          done
