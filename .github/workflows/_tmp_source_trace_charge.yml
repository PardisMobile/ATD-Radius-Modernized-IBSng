name: _tmp_source_trace_charge
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract canonical source
        run: |
          rm -rf /tmp/ibsng
          mkdir -p /tmp/ibsng
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/ibsng
      - name: Trace exact charge flow
        run: |
          {
            echo '===== core/charge/charge.py ====='
            sed -n '1,360p' /tmp/ibsng/IBSng/core/charge/charge.py
            echo '===== core/charge/internet_charge.py ====='
            sed -n '1,180p' /tmp/ibsng/IBSng/core/charge/internet_charge.py
            echo '===== core/user/normal_user.py ====='
            sed -n '1,130p' /tmp/ibsng/IBSng/core/user/normal_user.py
            echo '===== core/user/voip_user.py ====='
            sed -n '1,140p' /tmp/ibsng/IBSng/core/user/voip_user.py
            echo '===== core/user/user.py credit/logout ====='
            sed -n '120,270p' /tmp/ibsng/IBSng/core/user/user.py
            echo '===== core/user/plugins/charge.py ====='
            sed -n '1,130p' /tmp/ibsng/IBSng/core/user/plugins/charge.py
          } > docs/_tmp_A124_CHARGE_TRACE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_tmp_A124_CHARGE_TRACE.txt
          git diff --cached --quiet || git commit -m "chore: refresh A1.24 charge trace"
          git push
