name: _tmp_source_trace_charge
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf /tmp/ibsng && mkdir -p /tmp/ibsng
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/ibsng
          {
            echo '===== charge.py ====='
            sed -n '1,360p' /tmp/ibsng/IBSng/core/charge/charge.py
            echo '===== internet_charge.py ====='
            sed -n '1,180p' /tmp/ibsng/IBSng/core/charge/internet_charge.py
            echo '===== normal_user.py ====='
            sed -n '1,130p' /tmp/ibsng/IBSng/core/user/normal_user.py
            echo '===== user.py ====='
            sed -n '120,270p' /tmp/ibsng/IBSng/core/user/user.py
          } > docs/_tmp_A124_CHARGE_EXACT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_tmp_A124_CHARGE_EXACT.txt
          git commit -m "chore: record exact A1.24 charge flow" || true
          git push
