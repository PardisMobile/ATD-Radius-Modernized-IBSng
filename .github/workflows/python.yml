name: Python

on:
  push:
    branches: [main, "audit/a124-portmaster-portslave-source"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Inspect canonical PortMaster PortSlave source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a124
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/a124
          for f in /tmp/a124/IBSng/core/ras/rases/portmaster.py /tmp/a124/IBSng/core/ras/rases/portslave.py; do
            echo "===== FILE: $f ====="
            grep -nE 'class .*Ras|type_attrs|def (__addUniqueIDToRasMsg|handleRadAuthPacket|handleRadAcctPacket|__internetAcct(Start|Stop|Update)|killUser|__kill|disconnect|tryToReOnline)' "$f" || true
            grep -nE 'unique_id|setInAttrs|setInAttrsIfExists|Acct-Status-Type|setAction|User-Name|User-Password|CHAP-Password|MS-CHAP|NAS-Port|Acct-Session-Id|Framed-IP-Address|Acct-Terminate-Cause|multi_login|ip_assignment|snmp|launcher' "$f" || true
          done

