name: Python
on:
  push:
    branches: [main, "audit/a124-cisco-source"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Inspect canonical Cisco source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a124
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/a124
          echo '--- CANDIDATE FILES ---'
          find /tmp/a124 -type f | grep -Ei 'cisco.*\.py$' | sort
          echo '--- CISCO SOURCE ---'
          while IFS= read -r f; do
            echo "===== $f ====="
            sed -n '1,360p' "$f"
          done < <(find /tmp/a124 -type f | grep -Ei 'cisco.*\.py$' | sort)
