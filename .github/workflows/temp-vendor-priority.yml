name: temp-vendor-priority
on:
  push:
    paths: [".github/workflows/temp-vendor-priority.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          mkdir -p /tmp/ibs
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/ibs
          grep -RHE '^(VENDOR|ATTRIBUTE).*Mikrotik|^(VENDOR|ATTRIBUTE).*Cisco|^(VENDOR|ATTRIBUTE).*Quintum|USR-Interface-Index' /tmp/ibs/IBSng/radius_server --include='dictionary*' | head -250
