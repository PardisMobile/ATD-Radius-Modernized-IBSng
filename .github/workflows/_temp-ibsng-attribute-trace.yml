name: TEMP IBSng attribute trace
on:
  push:
    branches: [main]
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          rm -rf /tmp/i && mkdir /tmp/i
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/i
          echo '=== multi_login refs ==='
          grep -Rni --exclude='*.pyc' -E 'multi_login|MultiLogin|instances|USER_LOGIN' /tmp/i | head -n 500 || true
          echo '=== MULTILOGIN SOURCE ==='
          cat /tmp/i/IBSng/core/user/plugins/multilogin.py
          echo '=== ATTRIBUTE CLASS ==='
          cat /tmp/i/IBSng/core/user/attribute.py
          echo '=== USER ATTRIBUTE ACCESS ==='
          grep -n -B5 -A12 -E 'def getUserAttrs|def getAttribute|def getAttrs|def login' /tmp/i/IBSng/core/user/user.py
          echo '=== RAS MSG ATTR DOC ==='
          cat /tmp/i/IBSng/docs/ras_msg_attrs
          echo '=== RAS internet multi-login refs ==='
          grep -Rni --include='*.py' -E 'multi_login|ras_msg\["multi_login"\]|getAttribute\(".*multi_login' /tmp/i/IBSng/core/ras/rases
