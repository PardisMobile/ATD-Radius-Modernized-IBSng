name: Temporary A1.24 kill-path verification

on:
  push:
    branches:
      - audit/a124-provider-side-effects-20261009

permissions:
  contents: read

jobs:
  inspect-kill-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract canonical archive and verify hash
        run: |
          set -euo pipefail
          archive="Source of Truth/IBSng-A1.24.tar.bz2"
          echo "Expected canonical SHA-256:"
          sha256sum "$archive"
          mkdir -p /tmp/a124-source
          tar -xjf "$archive" -C /tmp/a124-source
          test -f /tmp/a124-source/IBSng/core/ras/rases/tenor.py
      - name: Inspect exact killUser implementations
        run: |
          set -euo pipefail
          root=/tmp/a124-source/IBSng/core/ras/rases
          grep -R -n -A24 -B3 'def killUser' "$root" || true
          echo "========== tenor.py full relevant path =========="
          echo "========== pppd.py source header and kill path =========="
          sed -n '1,52p' "$root/pppd.py"
          echo "========== base killUser definitions =========="
          grep -R -n -A12 -B3 'def killUser' /tmp/a124-source/IBSng/core/ras/ras.py /tmp/a124-source/IBSng/core/ras/voip_ras.py || true
          echo "========== tenor killUser check =========="
          grep -n -A8 -B4 'def killUser' "$root/tenor.py" || true
          sed -n '1,190p' "$root/tenor.py"
