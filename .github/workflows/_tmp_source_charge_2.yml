name: temp-source-charge-2
on:
  push:
    paths:
      - ".github/workflows/_tmp_source_charge_2.yml"
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/src
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/src
          for f in $(find /tmp/src -type f \( -name 'internet_charge_rule.py' -o -name 'user_charge.py' -o -name 'online.py' \)); do
            echo "===== $f ====="
            sed -n '1,360p' "$f"
          done > /tmp/trace.txt
      - uses: actions/upload-artifact@v4
        with:
          name: charge-source-trace-2
          path: /tmp/trace.txt
