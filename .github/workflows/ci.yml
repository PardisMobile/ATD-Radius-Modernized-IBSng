name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ATD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atd_test
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[test]"; fi
          pip install pytest ruff
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Ruff
        run: ruff check src tests
      - name: PHP syntax
        run: |
          find ui -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: pytest -q
