name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest ruff
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Ruff
        run: ruff check src tests
      - name: TEMP A1.24 accounting source trace
        run: |
          rm -rf /tmp/a124 && mkdir -p /tmp/a124
          tar -xjf 'Source of Truth/IBSng-A1.24.tar.bz2' -C /tmp/a124
          sed -n '1,150p' /tmp/a124/IBSng/core/user/normal_user.py
          sed -n '1,150p' /tmp/a124/IBSng/core/user/voip_user.py
          sed -n '1,120p' /tmp/a124/IBSng/core/user/connection_log.py
          grep -RniE 'INTERNET_UPDATE|VOIP_UPDATE|start_accounting|used_credit|logToConnectionLog' /tmp/a124/IBSng/core/ras/rases /tmp/a124/IBSng/core/user | head -n 250

      - name: PHP syntax
        run: |
          find ui -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: pytest -q
