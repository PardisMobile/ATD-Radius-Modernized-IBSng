name: temp-source-rule-start
on:
  push:
    paths:
      - ".github/workflows/_tmp_source_rule_start.yml"
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/src
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/src
          f=$(find /tmp/src -path '*/core/charge/internet_charge_rule.py' | head -1)
          grep -n -B 25 -A 45 "def start" "$f" > /tmp/trace.txt
      - uses: actions/upload-artifact@v4
        with:
          name: charge-rule-start-source
          path: /tmp/trace.txt
