name: tmp-a124-accounting-detail
on:
  push:
    branches: [main]
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf /tmp/a124 && mkdir -p /tmp/a124
          tar -xjf 'Source of Truth/IBSng-A1.24.tar.bz2' -C /tmp/a124
          for f in core/ras/rases/mikrotik.py core/ras/rases/bsae.py core/ras/rases/cisco.py core/ras/rases/pppd.py core/user/connection_log.py core/user/user.py core/user/plugins/charge.py core/charge/charge.py; do
            echo "===== $f ====="
            sed -n '1,430p' "/tmp/a124/IBSng/$f" | sed -n '/def handleRadAcctPacket/,/def /p;/def logConnectionQuery/,/def /p;/def __handleStartAccounting/,/def /p;/def __handleStopAccounting/,/def /p;/def startAccounting/,/def /p' | head -260
          done
