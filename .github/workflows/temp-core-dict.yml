name: temp-core-dict
on:
  push:
    paths: [".github/workflows/temp-core-dict.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          mkdir -p /tmp/ibs
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/ibs
          echo "===== CORE ====="
          cat /tmp/ibs/IBSng/radius_server/dictionary
