name: A1.24 Cisco source audit
on:
  push:
    branches: ["audit/a124-cisco-source"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Cisco parity facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a124
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/a124
          for f in /tmp/a124/IBSng/core/ras/rases/cisco.py /tmp/a124/IBSng/core/ras/rases/cisco_vpdn.py; do
            echo "===== FILE: $f ====="
            echo "--- class/type_attrs ---"
            grep -nE 'class .*Ras|type_attrs|def init\(' "$f" || true
            echo "--- auth/accounting/identity ---"
            grep -nE 'def (__addUniqueIDToRasMsg|handleRadAuthPacket|handleRadAcctPacket|__internetAcct(Start|Stop|Update)|__voipAcct(Start|Stop|Update)|killUser|__killUser|__killBy|disconnect|tryToReOnline)' "$f" || true
            echo "--- relevant source windows ---"
            grep -nE 'unique_id|setInAttrs|setInAttrsIfExists|Acct-Status-Type|setAction|Cisco-NAS-Port|MS-CHAP|CHAP-Password|User-Password|Acct-Session-Id|H323|h323_conf_id|Calling-Station-Id|Framed-IP-Address|Acct-Terminate-Cause|disconnect|snmp|rsh' "$f" || true
          done
