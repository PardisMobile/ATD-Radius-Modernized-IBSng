name: A1.24 Cisco source audit
on:
  push:
    branches: ["audit/a124-cisco-source"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect canonical Cisco source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a124
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/a124
          echo '--- CANDIDATE FILES ---'
          find /tmp/a124 -type f | grep -Ei 'cisco.*\.py$' | sort
          echo '--- CISCO SOURCE ---'
          while IFS= read -r f; do
            echo "===== $f ====="
            sed -n '1,360p' "$f"
          done < <(find /tmp/a124 -type f | grep -Ei 'cisco.*\.py$' | sort)
