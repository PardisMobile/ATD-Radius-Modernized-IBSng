name: _temp-source-schema
on:
  push:
    paths:
      - .github/workflows/_temp-source-schema.yml
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir -p /tmp/i
          tar -xjf "Source of Truth/IBSng-A1.24.tar.bz2" -C /tmp/i
          R="$(find /tmp/i -maxdepth 2 -type d -name IBSng | head -1)"
          find "$R" -type f \( -name '*.sql' -o -name '*.py' \) | grep -E 'db|sql|attribute|group|user' | sort | head -300
          echo '=== TABLE DEFINITIONS ==='
          grep -RniE 'CREATE TABLE|CREATE SEQUENCE|user_attrs|group_attrs|normal_users|groups' "$R" --include='*.sql' --include='*.py' 2>/dev/null | head -1200